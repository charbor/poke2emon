[workspace]
authors = ["Cyris Kissane <cyris.kissane@gmail.com>"]
channels = ["conda-forge", "pytorch"]
name = "poke2emon"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
generate-mesh = { cmd = "python scripts/generate_mesh.py", depends-on = [] }
pokemonify = { cmd = "python scripts/pokemonify.py" }

[dependencies]
python = "3.11.*"
pytorch = "*"
torchvision = "*"
cpuonly = "*"
google-genai = ">=1.69.0,<2"
pillow = ">=12.1.1,<13"

[pypi-dependencies]
hy3dgen = { git = "https://github.com/Tencent-Hunyuan/Hunyuan3D-2.git" }
google-genai = "*"
