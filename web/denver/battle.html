<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denver Pokemon Battle Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'VT323',monospace;
  background:linear-gradient(135deg,#1a1a2e 0%,#0f3460 100%);
  color:#e0e0e0;
  min-height:100vh;
  font-size:18px;
  overflow-x:hidden;
}
header{
  text-align:center;
  padding:20px 20px 10px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
header h1{
  font-family:'Press Start 2P',cursive;
  font-size:clamp(14px,3vw,28px);
  color:#fdcb6e;
  text-shadow:0 0 20px rgba(253,203,110,.4);
  letter-spacing:2px;
}
.header-link{
  font-family:'VT323',monospace;
  font-size:18px;
  color:#a29bfe;
  text-decoration:none;
  border:2px solid #a29bfe;
  padding:4px 12px;
  border-radius:6px;
  transition:all .2s;
}
.header-link:hover{color:#fdcb6e;border-color:#fdcb6e;}
.turn-counter{
  font-family:'Press Start 2P',cursive;
  font-size:12px;
  color:#a29bfe;
  padding:4px 12px;
  border:2px solid #a29bfe;
  border-radius:6px;
}

/* TYPE COLORS */
.type-Grass{background:#00b894;}
.type-Fire{background:#e17055;}
.type-Ice{background:#74b9ff;}
.type-Water{background:#0984e3;}
.type-Ground{background:#b08968;}
.type-Normal{background:#b2bec3;}
.type-Flying{background:#a29bfe;}
.type-Bug{background:#a8e6cf;}
.type-Dark{background:#2d3436;}
.type-Poison{background:#6c5ce7;}
.type-Electric{background:#fdcb6e;}
.type-Rock{background:#636e72;}
.type-Ghost{background:#7d3c98;}
.type-Fairy{background:#fd79a8;}

/* ============ SELECT SCREEN ============ */
#selectScreen{padding:20px;}
.select-subtitle{
  text-align:center;
  font-size:clamp(20px,3vw,32px);
  color:#a29bfe;
  margin-bottom:20px;
}
.select-grid{
  max-width:1200px;
  margin:0 auto 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;
  padding:0 20px;
}
.select-card{
  background:linear-gradient(145deg,#16213e,#1a1a2e);
  border:2px solid #2d3436;
  border-radius:10px;
  padding:10px;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  text-align:center;
  position:relative;
}
.select-card:hover{
  transform:translateY(-4px);
  box-shadow:0 6px 20px rgba(162,155,254,.3);
  border-color:#a29bfe;
}
.select-card.selected{
  border-color:#fdcb6e;
  box-shadow:0 0 20px rgba(253,203,110,.5),0 0 40px rgba(253,203,110,.2);
}
.select-card canvas,.select-card .poke-img{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:96px;
  height:96px;
}
.poke-img{image-rendering:pixelated;image-rendering:crisp-edges;}
.poke-img.mirror{transform:scaleX(-1);}
.select-card .sc-name{
  font-family:'Press Start 2P',cursive;
  font-size:9px;
  color:#dfe6e9;
  margin:4px 0 2px;
}
.select-card .sc-types{display:flex;gap:4px;justify-content:center;margin:4px 0;}
.select-card .sc-types span{
  font-size:12px;
  padding:1px 6px;
  border-radius:3px;
  color:#fff;
  text-transform:uppercase;
}
.select-card .sc-bst{font-size:14px;color:#636e72;}
.stat-preview{
  display:none;
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%);
  background:#0d1b2a;
  border:2px solid #a29bfe;
  border-radius:8px;
  padding:10px;
  z-index:100;
  width:200px;
  pointer-events:none;
}
.select-card:hover .stat-preview{display:block;}
.stat-preview .sp-row{
  display:flex;
  align-items:center;
  gap:6px;
  margin:2px 0;
  font-size:14px;
}
.stat-preview .sp-label{width:40px;color:#636e72;text-align:right;}
.stat-preview .sp-bar{flex:1;height:8px;background:#2d3436;border-radius:4px;overflow:hidden;}
.stat-preview .sp-fill{height:100%;border-radius:4px;transition:width .3s;}
.stat-preview .sp-val{width:30px;color:#dfe6e9;text-align:right;}
.battle-btn-wrap{text-align:center;margin:20px 0;min-height:60px;}
#battleBtn{
  font-family:'Press Start 2P',cursive;
  font-size:18px;
  padding:14px 40px;
  background:linear-gradient(135deg,#e17055,#d63031);
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
  transition:all .3s;
  display:none;
  animation:pulse 1.5s infinite;
}
#battleBtn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(225,112,85,.5);}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(225,112,85,.3)}50%{box-shadow:0 0 25px rgba(225,112,85,.6)}}

/* ============ REVEAL OVERLAY ============ */
#revealOverlay{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.85);
  z-index:1000;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:20px;
}
#revealOverlay.show{display:flex;}
#revealOverlay .reveal-text{
  font-family:'Press Start 2P',cursive;
  font-size:clamp(14px,3vw,24px);
  color:#fdcb6e;
  text-shadow:0 0 20px rgba(253,203,110,.5);
  animation:fadeInUp .5s ease;
}
#revealOverlay canvas,#revealOverlay .poke-img{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:192px;height:192px;
  animation:fadeInUp .8s ease;
}
#revealOverlay .reveal-name{
  font-family:'Press Start 2P',cursive;
  font-size:18px;
  color:#e0e0e0;
  animation:fadeInUp 1s ease;
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* ============ BATTLE SCREEN ============ */
#battleScreen{display:none;padding:10px 20px;max-width:900px;margin:0 auto;}
.battle-field{
  position:relative;
  background:linear-gradient(180deg,#0a0a1e 0%,#16213e 50%,#1e3a5f 100%);
  border:2px solid #2d3436;
  border-radius:12px;
  padding:20px;
  min-height:360px;
  margin-bottom:10px;
}
/* Weather banner */
.weather-banner{
  display:none;
  position:absolute;
  top:8px;left:50%;transform:translateX(-50%);
  font-family:'Press Start 2P',cursive;
  font-size:10px;
  color:#74b9ff;
  background:rgba(13,27,42,.8);
  padding:4px 12px;
  border-radius:6px;
  border:1px solid #0984e3;
}
.weather-banner.active{display:block;}

/* Opponent info top-right */
.opp-info{
  position:absolute;
  top:20px;right:20px;
  text-align:right;
}
.opp-info .bi-name{
  font-family:'Press Start 2P',cursive;
  font-size:12px;
  color:#dfe6e9;
}
.opp-info .bi-level{font-size:16px;color:#636e72;margin-left:8px;}
.opp-info .hp-bar-wrap{
  width:220px;
  height:14px;
  background:#2d3436;
  border-radius:7px;
  overflow:hidden;
  margin:4px 0;
  border:1px solid #444;
}
.opp-info .hp-bar-fill{
  height:100%;
  border-radius:7px;
  transition:width .6s ease,background .3s;
}
.opp-info .hp-text{font-size:16px;color:#b2bec3;}
.status-badge{
  display:inline-block;
  font-family:'Press Start 2P',cursive;
  font-size:8px;
  padding:2px 6px;
  border-radius:4px;
  color:#fff;
  margin-top:2px;
}
.status-BRN{background:#e17055;}
.status-PSN{background:#6c5ce7;}
.status-TOX{background:#6c5ce7;}
.status-PAR{background:#fdcb6e;color:#111;}
.status-SLP{background:#636e72;}
.status-FRZ{background:#74b9ff;color:#111;}
.status-CNF{background:#fd79a8;}
.stat-changes{font-size:14px;color:#fdcb6e;margin-top:2px;}

/* Player info bottom-left */
.player-info{
  position:absolute;
  bottom:20px;left:20px;
}
.player-info .bi-name{
  font-family:'Press Start 2P',cursive;
  font-size:12px;
  color:#dfe6e9;
}
.player-info .bi-level{font-size:16px;color:#636e72;margin-left:8px;}
.player-info .hp-bar-wrap{
  width:220px;
  height:14px;
  background:#2d3436;
  border-radius:7px;
  overflow:hidden;
  margin:4px 0;
  border:1px solid #444;
}
.player-info .hp-bar-fill{
  height:100%;
  border-radius:7px;
  transition:width .6s ease,background .3s;
}
.player-info .hp-text{font-size:16px;color:#b2bec3;}

/* Sprites in field */
.opp-sprite{
  position:absolute;
  top:60px;right:80px;
}
.opp-sprite canvas,.opp-sprite .poke-img{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:128px;height:128px;
  transition:opacity .3s;
}
.player-sprite{
  position:absolute;
  bottom:60px;left:40px;
}
.player-sprite canvas,.player-sprite .poke-img{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:128px;height:128px;
  transition:opacity .3s;
}
/* Sprite animations */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes superFlash{0%,100%{filter:brightness(1)}50%{filter:brightness(3)}}
@keyframes faintAnim{to{opacity:0;transform:translateY(40px)}}
.shake{animation:shake .3s ease 2;}
.super-flash{animation:superFlash .2s ease 3;}
.faint{animation:faintAnim .8s ease forwards;}

/* Floating stat text */
.float-text{
  position:absolute;
  font-family:'Press Start 2P',cursive;
  font-size:10px;
  pointer-events:none;
  animation:floatUp 1.5s ease forwards;
  z-index:50;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}

/* ============ MOVE PANEL ============ */
.move-panel{
  background:#0d1b2a;
  border:2px solid #2d3436;
  border-radius:10px;
  padding:14px;
  margin-bottom:10px;
}
.move-prompt{
  font-family:'Press Start 2P',cursive;
  font-size:11px;
  color:#dfe6e9;
  margin-bottom:10px;
}
.move-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.move-btn{
  font-family:'VT323',monospace;
  font-size:18px;
  padding:10px;
  border:2px solid #444;
  border-radius:8px;
  cursor:pointer;
  transition:all .2s;
  text-align:left;
  position:relative;
  color:#fff;
}
.move-btn:hover{
  transform:scale(1.03);
  box-shadow:0 4px 15px rgba(0,0,0,.3);
  border-color:#fdcb6e;
}
.move-btn.disabled{opacity:.5;cursor:not-allowed;pointer-events:none;}
.move-btn .mb-name{font-size:20px;font-weight:bold;}
.move-btn .mb-info{display:flex;gap:8px;align-items:center;margin-top:2px;}
.move-btn .mb-type{
  font-size:12px;
  padding:1px 6px;
  border-radius:3px;
  color:#fff;
  text-transform:uppercase;
}
.move-btn .mb-pow{font-size:14px;color:rgba(255,255,255,.7);}
.move-btn .mb-eff{
  position:absolute;
  top:4px;right:6px;
  font-size:12px;
  font-family:'Press Start 2P',cursive;
}
.move-btn .move-tooltip{
  display:none;
  position:absolute;
  bottom:calc(100% + 8px);
  left:0;
  width:280px;
  background:#0d1b2a;
  border:2px solid #555;
  border-radius:8px;
  padding:10px 12px;
  font-size:15px;
  color:#dfe6e9;
  line-height:1.3;
  z-index:100;
  pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
.move-btn:hover .move-tooltip{display:block;}

/* ============ BATTLE LOG ============ */
.battle-log{
  background:#0d1b2a;
  border:2px solid #2d3436;
  border-radius:10px;
  padding:10px 14px;
  height:160px;
  overflow-y:auto;
  font-size:17px;
  line-height:1.4;
}
.battle-log::-webkit-scrollbar{width:6px;}
.battle-log::-webkit-scrollbar-thumb{background:#636e72;border-radius:3px;}
.log-line{margin:2px 0;}
.log-super{color:#00b894;font-weight:bold;}
.log-nve{color:#636e72;font-style:italic;}
.log-immune{color:#e74c3c;font-weight:bold;}
.log-crit{color:#fdcb6e;}
.log-status{color:#a29bfe;}
.log-damage{color:#e0e0e0;}
.log-faint{color:#e74c3c;font-weight:bold;}
.log-heal{color:#00b894;}

/* ============ RESULT SCREEN ============ */
#resultScreen{
  display:none;
  text-align:center;
  padding:40px 20px;
}
#resultScreen .result-title{
  font-family:'Press Start 2P',cursive;
  font-size:clamp(20px,5vw,40px);
  margin-bottom:20px;
  animation:fadeInUp .8s ease;
}
#resultScreen .result-title.victory{color:#00b894;text-shadow:0 0 30px rgba(0,184,148,.5);}
#resultScreen .result-title.defeat{color:#e74c3c;text-shadow:0 0 30px rgba(231,76,60,.5);}
#resultScreen canvas,#resultScreen .poke-img{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:192px;height:192px;
  margin:20px auto;
  display:block;
  animation:bounce 1s ease infinite alternate;
}
@keyframes bounce{0%{transform:translateY(0)}100%{transform:translateY(-10px)}}
.result-stats{
  max-width:400px;
  margin:20px auto;
  background:#16213e;
  border:2px solid #2d3436;
  border-radius:10px;
  padding:16px;
  text-align:left;
}
.result-stats .rs-row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  font-size:20px;
  border-bottom:1px solid #2d3436;
}
.result-stats .rs-row:last-child{border:none;}
.result-stats .rs-label{color:#636e72;}
.result-stats .rs-val{color:#fdcb6e;}
.result-btns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.result-btns button,.result-btns a{
  font-family:'Press Start 2P',cursive;
  font-size:12px;
  padding:12px 24px;
  border-radius:8px;
  cursor:pointer;
  transition:all .2s;
  text-decoration:none;
  display:inline-block;
}
.result-btns .btn-again{
  background:linear-gradient(135deg,#00b894,#00cec9);
  color:#fff;border:none;
}
.result-btns .btn-again:hover{transform:scale(1.05);}
.result-btns .btn-pokedex{
  background:transparent;
  color:#a29bfe;
  border:2px solid #a29bfe;
}
.result-btns .btn-pokedex:hover{color:#fdcb6e;border-color:#fdcb6e;}

@media(max-width:600px){
  .select-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .select-card canvas,.select-card .poke-img{width:72px;height:72px;}
  .select-card .sc-name{font-size:7px;}
  .battle-field{min-height:300px;padding:12px;}
  .opp-sprite canvas,.player-sprite canvas,.opp-sprite .poke-img,.player-sprite .poke-img{width:96px;height:96px;}
  .opp-info .hp-bar-wrap,.player-info .hp-bar-wrap{width:160px;}
  .move-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<header>
  <h1>DENVER POKEMON BATTLE ARENA</h1>
  <a class="header-link" href="pokedex.html">Back to Pokedex</a>
  <div class="turn-counter" id="turnCounter" style="display:none">Turn 1</div>
</header>

<!-- SELECT SCREEN -->
<div id="selectScreen">
  <div class="select-subtitle">Choose Your Fighter!</div>
  <div class="select-grid" id="selectGrid"></div>
  <div class="battle-btn-wrap">
    <button id="battleBtn" onclick="startBattle()">BATTLE!</button>
  </div>
</div>

<!-- REVEAL OVERLAY -->
<div id="revealOverlay">
  <div class="reveal-text">Your opponent is...</div>
  <img id="revealCanvas" class="poke-img mirror">
  <div class="reveal-name" id="revealName"></div>
</div>

<!-- BATTLE SCREEN -->
<div id="battleScreen">
  <div class="battle-field" id="battleField">
    <div class="weather-banner" id="weatherBanner">Rain</div>
    <!-- Opponent -->
    <div class="opp-info" id="oppInfo">
      <span class="bi-name" id="oppName"></span><span class="bi-level">Lv50</span>
      <div class="hp-bar-wrap"><div class="hp-bar-fill" id="oppHpBar" style="width:100%;background:#00b894"></div></div>
      <div class="hp-text" id="oppHpText"></div>
      <div id="oppStatus"></div>
      <div class="stat-changes" id="oppStatChanges"></div>
    </div>
    <div class="opp-sprite" id="oppSpriteWrap">
      <img id="oppCanvas" class="poke-img mirror">
    </div>
    <!-- Player -->
    <div class="player-sprite" id="playerSpriteWrap">
      <img id="playerCanvas" class="poke-img">
    </div>
    <div class="player-info" id="playerInfo">
      <span class="bi-name" id="playerName"></span><span class="bi-level">Lv50</span>
      <div class="hp-bar-wrap"><div class="hp-bar-fill" id="playerHpBar" style="width:100%;background:#00b894"></div></div>
      <div class="hp-text" id="playerHpText"></div>
      <div id="playerStatus"></div>
      <div class="stat-changes" id="playerStatChanges"></div>
    </div>
  </div>
  <div class="move-panel" id="movePanel">
    <div class="move-prompt" id="movePrompt">What will your Pokemon do?</div>
    <div class="move-grid" id="moveGrid"></div>
  </div>
  <div class="battle-log" id="battleLog"></div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen">
  <div class="result-title" id="resultTitle"></div>
  <img id="resultCanvas" class="poke-img">
  <div class="result-stats" id="resultStats"></div>
  <div class="result-btns">
    <button class="btn-again" onclick="location.reload()">Battle Again</button>
    <a class="btn-pokedex" href="pokedex.html">Back to Pokedex</a>
  </div>
</div>

<script>
/* ============================= DATA ============================= */
const TYPE_COLORS={
  Grass:'#00b894',Fire:'#e17055',Ice:'#74b9ff',Water:'#0984e3',Ground:'#b08968',
  Normal:'#b2bec3',Flying:'#a29bfe',Bug:'#a8e6cf',Dark:'#2d3436',Poison:'#6c5ce7',
  Electric:'#fdcb6e',Rock:'#636e72',Ghost:'#7d3c98',Fairy:'#fd79a8'
};

const MOVES={
"Razor Leaf":{type:"Grass",power:55,acc:95,cat:"Physical",desc:"Sharp-edged leaves. Critical hits land more easily.",highCrit:true},
"Giga Drain":{type:"Grass",power:75,acc:100,cat:"Special",desc:"Drains nutrients. Heals 50% of damage dealt.",drain:0.5},
"Leech Seed":{type:"Grass",power:null,acc:90,cat:"Status",desc:"Plants a seed that drains 1/8 HP every turn.",effect:"leechseed"},
"Seed Bomb":{type:"Grass",power:80,acc:100,cat:"Physical",desc:"Hurls hard-shelled seeds at the target."},
"Leaf Storm":{type:"Grass",power:130,acc:90,cat:"Special",desc:"Whips up a storm of leaves. Harshly lowers user's Sp. Atk.",selfStat:{spa:-2}},
"Petal Dance":{type:"Grass",power:120,acc:100,cat:"Special",desc:"Attacks for 2-3 turns, then user becomes confused.",lockIn:true},
"Ember":{type:"Fire",power:40,acc:100,cat:"Special",desc:"Small flames. 10% chance to burn.",secondary:{status:"BRN",chance:10}},
"Fire Spin":{type:"Fire",power:35,acc:85,cat:"Special",desc:"Traps in fire for 4-5 turns (1/8 HP/turn).",effect:"firespin"},
"Ice Beam":{type:"Ice",power:90,acc:100,cat:"Special",desc:"Icy beam. 10% chance to freeze.",secondary:{status:"FRZ",chance:10}},
"Blizzard":{type:"Ice",power:110,acc:70,cat:"Special",desc:"Howling blizzard. 10% chance to freeze.",secondary:{status:"FRZ",chance:10}},
"Powder Snow":{type:"Ice",power:40,acc:100,cat:"Special",desc:"Chilling snow gust. 10% chance to freeze.",secondary:{status:"FRZ",chance:10}},
"Ice Shard":{type:"Ice",power:40,acc:100,cat:"Physical",desc:"Flash-frozen ice chunks. Always goes first.",priority:1},
"Frost Breath":{type:"Ice",power:60,acc:90,cat:"Special",desc:"Cold breath. Always crits.",alwaysCrit:true},
"Water Gun":{type:"Water",power:40,acc:100,cat:"Special",desc:"Forceful shot of water."},
"Surf":{type:"Water",power:90,acc:100,cat:"Special",desc:"Giant wave attack."},
"Aqua Jet":{type:"Water",power:40,acc:100,cat:"Physical",desc:"Lunges at incredible speed. Always goes first.",priority:1},
"Bubble":{type:"Water",power:40,acc:100,cat:"Special",desc:"Spray of bubbles. May lower Speed.",secondary:{stat:{spe:-1},chance:10}},
"Rain Dance":{type:"Water",power:null,acc:null,cat:"Status",desc:"Summons rain for 5 turns. Water 1.5x, Fire 0.5x.",effect:"rain"},
"Tackle":{type:"Normal",power:40,acc:100,cat:"Physical",desc:"Charges and slams."},
"Quick Attack":{type:"Normal",power:40,acc:100,cat:"Physical",desc:"Attacks at blinding speed. Always goes first.",priority:1},
"Headbutt":{type:"Normal",power:70,acc:100,cat:"Physical",desc:"Head charge. 30% flinch.",secondary:{flinch:true,chance:30}},

function getTypeEffectiveness(moveType,defTypes){
  let mult=1;
  defTypes.forEach(dt=>{mult*=(TYPE_CHART[moveType]&&TYPE_CHART[moveType][dt]!==undefined)?TYPE_CHART[moveType][dt]:1;});
  return mult;
}

/* ============================= STAT CALC ============================= */
function calcHP(base){return Math.floor((2*base+31)*50/100)+50+10;}
function calcStat(base){return Math.floor((2*base+31)*50/100)+5;}

function getStatMultiplier(stage){
  if(stage>=0) return (2+stage)/2;
  return 2/(2-stage);
}
function getAccMultiplier(stage){
  if(stage>=0) return (3+stage)/3;
  return 3/(3-stage);
}

/* ============================= PIXEL ART ============================= */
function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w||1,h||1);}
function rect(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function eye(ctx,x,y,s,pc,hc){
  rect(ctx,x,y,s,s,'#fff');
  var ps=Math.max(1,Math.floor(s*0.5));
  rect(ctx,x+s-ps,y+s-ps,ps,ps,pc||'#111');
  if(s>=3)px(ctx,x+1,y,1,1,hc||'#aee');
  else if(s>=2)px(ctx,x,y,1,1,hc||'#aee');
}
function bigEye(ctx,x,y,s,pc,hc){
  rect(ctx,x,y,s,s,'#fff');
  var ps=Math.max(1,Math.floor(s*0.45));
  rect(ctx,x+s-ps-1,y+s-ps,ps,ps,pc||'#111');
  px(ctx,x+1,y+1,Math.max(1,Math.floor(s*0.3)),Math.max(1,Math.floor(s*0.3)),hc||'#aee');
}

function drawSprite(elId,pokemonId,mirror){
  const el=document.getElementById(elId);
  if(!el)return;
  const p=POKEMON.find(x=>x.id===pokemonId);
  if(!p)return;
  el.src='sprites/'+p.name.toLowerCase()+'.png?v=2';
  el.alt=p.name;
  if(mirror) el.classList.add('mirror');
  else el.classList.remove('mirror');
}

/* ============================= SOUND ============================= */
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq,dur,type,vol){
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type=type||'square';
    osc.frequency.value=freq;
    gain.gain.value=vol||0.1;
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+dur);
  }catch(e){}
}

/* ============================= GAME STATE ============================= */
let playerPoke=null, oppPoke=null;
let playerState=null, oppState=null;
let turnNum=0, battleOver=false, waitingForInput=false;
let battleStats={playerDmg:0,oppDmg:0,turns:0,superEffHits:0};
let weatherTurns=0; // rain turns remaining
let currentTurnMoves={player:null,opp:null}; // track chosen moves for sucker punch

function makeBattleState(poke){
  return {
    poke:poke,
    maxHp:calcHP(poke.stats.hp),
    hp:calcHP(poke.stats.hp),
    atk:calcStat(poke.stats.atk),
    def:calcStat(poke.stats.def),
    spa:calcStat(poke.stats.spa),
    spd:calcStat(poke.stats.spd),
    spe:calcStat(poke.stats.spe),
    stages:{atk:0,def:0,spa:0,spd:0,spe:0,acc:0,eva:0},
    status:null, // BRN, PSN, TOX, PAR, SLP, FRZ
    statusTurns:0,
    toxicCounter:0,
    confused:false,
    confuseTurns:0,
    leechSeed:false,
    fireSpinTurns:0,
    twoTurnMove:null, // {move,label} if charging
    recharging:false,
    petalTurns:0,
    flinched:false,
  };
}

function getEffStat(state,stat){
  const base=state[stat];
  let mult=getStatMultiplier(state.stages[stat]);
  if(stat==='spe'&&state.status==='PAR') mult*=0.5;
  // burn penalty applied in damage calc, not here
  return Math.max(1,Math.floor(base*mult));
}
function getEffAcc(state){return getAccMultiplier(state.stages.acc);}

/* ============================= UI HELPERS ============================= */
function delay(ms){return new Promise(r=>setTimeout(r,ms));}

function hpColor(ratio){
  if(ratio>0.5)return '#00b894';
  if(ratio>0.25)return '#fdcb6e';
  return '#e74c3c';
}

function updateHpBar(who){
  const st=who==='player'?playerState:oppState;
  const bar=document.getElementById(who==='player'?'playerHpBar':'oppHpBar');
  const txt=document.getElementById(who==='player'?'playerHpText':'oppHpText');
  const ratio=Math.max(0,st.hp/st.maxHp);
  bar.style.width=(ratio*100)+'%';
  bar.style.background=hpColor(ratio);
  txt.textContent=Math.max(0,st.hp)+' / '+st.maxHp;
}

function updateStatus(who){
  const st=who==='player'?playerState:oppState;
  const el=document.getElementById(who==='player'?'playerStatus':'oppStatus');
  let html='';
  if(st.status) html+='<span class="status-badge status-'+st.status+'">'+st.status+'</span> ';
  if(st.confused) html+='<span class="status-badge status-CNF">CNF</span>';
  el.innerHTML=html;
}

function updateStatChanges(who){
  const st=who==='player'?playerState:oppState;
  const el=document.getElementById(who==='player'?'playerStatChanges':'oppStatChanges');
  const names={atk:'ATK',def:'DEF',spa:'SPA',spd:'SPD',spe:'SPE',acc:'ACC'};
  let parts=[];
  for(let k in names){
    if(st.stages[k]>0) parts.push(names[k]+' +'+st.stages[k]);
    else if(st.stages[k]<0) parts.push(names[k]+' '+st.stages[k]);
  }
  el.textContent=parts.join(' ');
}

function floatText(who,text,color){
  const wrap=document.getElementById(who==='player'?'playerSpriteWrap':'oppSpriteWrap');
  const el=document.createElement('div');
  el.className='float-text';
  el.textContent=text;
  el.style.color=color||'#fdcb6e';
  el.style.left='10px';
  el.style.top='-10px';
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),1500);
}

function addLog(text,cls){
  const log=document.getElementById('battleLog');
  const line=document.createElement('div');
  line.className='log-line'+(cls?' '+cls:'');
  line.textContent='> '+text;
  log.appendChild(line);

function shakeSprite(who){

}

}

/* ============================= SELECT SCREEN ============================= */
let selectedId=null;

function buildSelectScreen(){

    // stat preview
    const statNames=['HP','ATK','DEF','SPA','SPD','SPE'];
    const statKeys=['hp','atk','def','spa','spd','spe'];
    const colors=['#00b894','#e17055','#fdcb6e','#a29bfe','#74b9ff','#fd79a8'];

    statKeys.forEach((k,i)=>{

    });

      +'<div class="sc-name">'+p.name+'</div>'
      +'<div class="sc-types">'+typeBadges+'</div>'

/* ============================= START BATTLE ============================= */
async function startBattle(){
  if(!selectedId)return;
  sfxClick();
  playerPoke=POKEMON.find(p=>p.id===selectedId);
  // AI picks random (different from player)
  let choices=POKEMON.filter(p=>p.id!==selectedId);
  oppPoke=choices[Math.floor(Math.random()*choices.length)];

  // Reveal animation
  const overlay=document.getElementById('revealOverlay');
  overlay.classList.add('show');
  drawSprite('revealCanvas',oppPoke.id,true);
  document.getElementById('revealName').textContent=oppPoke.name+' ('+oppPoke.types.join('/')+')';
  await delay(2500);
  overlay.classList.remove('show');

  // Switch screens
  document.getElementById('selectScreen').style.display='none';
  document.getElementById('battleScreen').style.display='block';
  document.getElementById('turnCounter').style.display='inline-block';

  // Init states
  playerState=makeBattleState(playerPoke);
  oppState=makeBattleState(oppPoke);
  turnNum=0;
  battleOver=false;
  weatherTurns=0;
  battleStats={playerDmg:0,oppDmg:0,turns:0,superEffHits:0};

  // Draw battle sprites
  document.getElementById('playerName').textContent=playerPoke.name;
  document.getElementById('oppName').textContent=oppPoke.name;
  drawSprite('playerCanvas',playerPoke.id,false);
  drawSprite('oppCanvas',oppPoke.id,true);
  updateHpBar('player');
  updateHpBar('opp');
  updateStatus('player');
  updateStatus('opp');
  updateStatChanges('player');
  updateStatChanges('opp');

  addLog('A wild '+oppPoke.name+' appeared!');
  addLog('Go, '+playerPoke.name+'!');

  await delay(800);
  promptMove();
}

/* ============================= MOVE BUTTONS ============================= */
function promptMove(){
  if(battleOver)return;
  waitingForInput=true;
  const panel=document.getElementById('movePanel');
  panel.style.display='block';
  document.getElementById('movePrompt').textContent='What will '+playerPoke.name+' do?';
  const grid=document.getElementById('moveGrid');
  grid.innerHTML='';

  // Check if player must do two-turn or recharge
  if(playerState.twoTurnMove){
    // auto-proceed
    waitingForInput=false;
    executeTurn(playerState.twoTurnMove.move);
    return;
  }
  if(playerState.recharging){
    waitingForInput=false;
    executeTurn('__recharge__');
    return;
  }
  if(playerState.petalTurns>0){
    waitingForInput=false;
    executeTurn('Petal Dance');
    return;
  }

  playerPoke.moves.forEach(mName=>{
    const md=MOVES[mName];
    if(!md)return;
    const btn=document.createElement('button');
    btn.className='move-btn';
    btn.style.background='linear-gradient(135deg,'+TYPE_COLORS[md.type]+'44,'+TYPE_COLORS[md.type]+'22)';
    btn.style.borderColor=TYPE_COLORS[md.type];

    // effectiveness hint
    const eff=getTypeEffectiveness(md.type,oppPoke.types);
    let effText='',effColor='';
    if(eff>=4){effText='4x';effColor='#00b894';}
    else if(eff>=2){effText='2x';effColor='#00b894';}
    else if(eff===0){effText='0x';effColor='#e74c3c';}
    else if(eff<=0.25){effText='\u00BCx';effColor='#636e72';}
    else if(eff<=0.5){effText='\u00BDx';effColor='#636e72';}
    const effSpan=eff!==1?'<span class="mb-eff" style="color:'+effColor+'">'+effText+'</span>':'';

    const powStr=md.power?'Pow:'+md.power:'--';
    const accStr=md.acc?md.acc+'%':'--';

    btn.innerHTML='<div class="mb-name">'+mName+'</div>'
      +'<div class="mb-info"><span class="mb-type" style="background:'+TYPE_COLORS[md.type]+'">'+md.type+'</span><span class="mb-pow">'+powStr+' / '+accStr+'</span></div>'
      +effSpan
      +'<div class="move-tooltip" style="border-color:'+TYPE_COLORS[md.type]+'">'
      +'<strong>'+mName+'</strong> ('+md.cat+')<br>'
      +md.desc
      +'</div>';

    btn.onclick=()=>{
      if(!waitingForInput)return;
      sfxClick();
      waitingForInput=false;
      executeTurn(mName);
    };
    grid.appendChild(btn);
  });
}

/* ============================= AI ============================= */
function aiChooseMove(){
  // handle forced moves
  if(oppState.twoTurnMove) return oppState.twoTurnMove.move;
  if(oppState.recharging) return '__recharge__';
  if(oppState.petalTurns>0) return 'Petal Dance';

  const moves=oppPoke.moves;
  // score each move
  let scored=moves.map(mName=>{
    const md=MOVES[mName];
    if(!md)return {name:mName,score:0};
    let score=0;
    if(md.power){
      const eff=getTypeEffectiveness(md.type,playerPoke.types);
      const stab=oppPoke.types.includes(md.type)?1.5:1;
      const aStat=md.cat==='Physical'?getEffStat(oppState,'atk'):getEffStat(oppState,'spa');
      const dStat=md.cat==='Physical'?getEffStat(playerState,'def'):getEffStat(playerState,'spd');
      score=md.power*eff*stab*(aStat/dStat);
    } else {
      // status moves
      if(md.effect==='sleep'||md.effect==='paralyze'||md.effect==='toxic'){
        score=playerState.status?10:80;
      } else if(md.selfStat){
        // boost moves worth more early
        score=turnNum<=2?70:30;
      } else if(md.targetStat){
        score=50;
      } else if(md.effect==='leechseed'){
        score=playerState.leechSeed?5:60;
      } else if(md.effect==='rain'){
        score=weatherTurns>0?5:50;
      } else if(md.effect==='confuse'){
        score=playerState.confused?5:60;
      } else {
        score=30;
      }
    }
    if(md.acc&&md.acc<100) score*=md.acc/100;
    return {name:mName,score};
  });

  scored.sort((a,b)=>b.score-a.score);
  const r=Math.random();
  if(r<0.7) return scored[0].name;
  if(r<0.9&&scored.length>1) return scored[1].name;
  return scored[Math.floor(Math.random()*scored.length)].name;
}

/* ============================= TURN EXECUTION ============================= */
async function executeTurn(playerMoveName){
  document.getElementById('movePanel').style.display='none';
  turnNum++;
  battleStats.turns=turnNum;
  document.getElementById('turnCounter').textContent='Turn '+turnNum;

  const aiMoveName=aiChooseMove();
  const pmd=MOVES[playerMoveName]||null;
  const amd=MOVES[aiMoveName]||null;

  // Store moves for sucker punch checks
  currentTurnMoves.player=playerMoveName;
  currentTurnMoves.opp=aiMoveName;

  // Determine order
  let first='player',second='opp';
  let firstMove=playerMoveName, secondMove=aiMoveName;

  const pPrio=pmd?pmd.priority||0:0;
  const aPrio=amd?amd.priority||0:0;

  if(pPrio!==aPrio){
    if(aPrio>pPrio){first='opp';second='player';firstMove=aiMoveName;secondMove=playerMoveName;}
  } else {
    const pSpe=getEffStat(playerState,'spe');
    const oSpe=getEffStat(oppState,'spe');
    if(oSpe>pSpe||(oSpe===pSpe&&Math.random()<0.5)){
      first='opp';second='player';firstMove=aiMoveName;secondMove=playerMoveName;
    }
  }

  // Reset flinch
  playerState.flinched=false;
  oppState.flinched=false;

  // Execute first move
  await executeMove(first,first==='player'?second:first==='opp'?'player':'opp',firstMove);
  if(battleOver)return;

  // Check if second can still act
  const secondState=second==='player'?playerState:oppState;
  if(secondState.hp>0){
    await executeMove(second,second==='player'?'opp':'player',secondMove);
  }
  if(battleOver)return;

  // End of turn effects
  await endOfTurnEffects();
  if(battleOver)return;

  // Next turn
  promptMove();
}

async function executeMove(attackerWho,defenderWho,moveName){
  if(battleOver)return;
  const atkState=attackerWho==='player'?playerState:oppState;
  const defState=defenderWho==='player'?playerState:oppState;
  const atkPoke=attackerWho==='player'?playerPoke:oppPoke;
  const defPoke=defenderWho==='player'?playerPoke:oppPoke;

  if(atkState.hp<=0)return;

  // Recharging
  if(moveName==='__recharge__'){
    addLog(atkPoke.name+' must recharge!');
    atkState.recharging=false;
    await delay(600);
    return;
  }

  const md=MOVES[moveName];
  if(!md)return;

  // Two-turn moves: turn 2 (attacking)
  if(atkState.twoTurnMove){
    addLog(atkPoke.name+' attacked!');
    atkState.twoTurnMove=null;
    // continue to damage calc below
  }
  // Two-turn moves: turn 1 (charging)
  else if(md.twoTurn&&!atkState.twoTurnMove){
    addLog(atkPoke.name+' '+md.twoTurn+'!');
    atkState.twoTurnMove={move:moveName,label:md.twoTurn};
    await delay(600);
    return;
  }

  // Check status conditions preventing action
  if(atkState.status==='SLP'){
    atkState.statusTurns--;
    if(atkState.statusTurns<=0){
      atkState.status=null;
      addLog(atkPoke.name+' woke up!','log-status');
      updateStatus(attackerWho);
    } else {
      addLog(atkPoke.name+' is fast asleep.','log-status');
      await delay(600);
      return;
    }
  }
  if(atkState.status==='FRZ'){
    if(Math.random()<0.2){
      atkState.status=null;
      addLog(atkPoke.name+' thawed out!','log-status');
      updateStatus(attackerWho);
    } else {
      addLog(atkPoke.name+' is frozen solid!','log-status');
      await delay(600);
      return;
    }
  }
  if(atkState.status==='PAR'){
    if(Math.random()<0.25){
      addLog(atkPoke.name+' is paralyzed! It can\'t move!','log-status');
      await delay(600);
      return;
    }
  }
  if(atkState.flinched){
    addLog(atkPoke.name+' flinched and couldn\'t move!');
    await delay(600);
    return;
  }

  // Confusion
  if(atkState.confused){
    atkState.confuseTurns--;
    if(atkState.confuseTurns<=0){
      atkState.confused=false;
      addLog(atkPoke.name+' snapped out of confusion!','log-status');
    } else {
      addLog(atkPoke.name+' is confused!','log-status');
      if(Math.random()<0.5){
        // Hit self
        const selfDmg=calcConfusionDmg(atkState);
        atkState.hp=Math.max(0,atkState.hp-selfDmg);
        addLog('It hurt itself in its confusion! ('+selfDmg+' damage)');
        updateHpBar(attackerWho);
        shakeSprite(attackerWho);
        await delay(600);
        if(atkState.hp<=0){
          await handleFaint(attackerWho);
        }
        return;
      }
    }
  }

  // Sucker Punch check: fails if opponent uses a status move
  if(md.suckerPunch){
    const defMoveName=currentTurnMoves[defenderWho];
    const defMd=defMoveName?MOVES[defMoveName]:null;
    if(defMd&&defMd.cat==='Status'){
      addLog('But it failed!');
      await delay(600);
      return;
    }
  }

  addLog(atkPoke.name+' used '+moveName+'!');
  await delay(400);

  // Status moves
  if(md.cat==='Status'){
    await handleStatusMove(attackerWho,defenderWho,moveName,md);
    await delay(400);
    return;
  }

  // Accuracy check
  if(md.acc!==null){
    const accMult=getEffAcc(atkState);
    const hitChance=md.acc*accMult/100;
    if(Math.random()>hitChance){
      addLog(atkPoke.name+'\'s attack missed!');
      await delay(400);
      return;
    }
  }

  // Multi-hit
  let hits=1;
  if(md.multiHit){
    const r=Math.random();
    if(r<0.33)hits=2;
    else if(r<0.66)hits=3;
    else if(r<0.83)hits=4;
    else hits=5;
  }

  let totalDmg=0;
  for(let h=0;h<hits;h++){
    // Damage calc
    let power=md.power;
    let aStat,dStat;

    if(md.foulPlay){
      // Uses defender's attack
      aStat=getEffStat(defState,'atk');
      dStat=getEffStat(defState,'def');
    } else if(md.cat==='Physical'){
      aStat=getEffStat(atkState,'atk');
      dStat=getEffStat(defState,'def');
    } else {
      aStat=getEffStat(atkState,'spa');
      dStat=getEffStat(defState,'spd');
    }

    // STAB
    const stab=atkPoke.types.includes(md.type)?1.5:1;

    // Type effectiveness
    const typeEff=getTypeEffectiveness(md.type,defPoke.types);

    if(typeEff===0){
      addLog('It doesn\'t affect '+defPoke.name+'...','log-immune');
      await delay(400);
      return;
    }

    // Critical hit
    let critMult=1;
    let isCrit=false;
    if(md.alwaysCrit){
      isCrit=true;critMult=1.5;
    } else {
      let critChance=md.highCrit?1/8:1/16;
      if(Math.random()<critChance){isCrit=true;critMult=1.5;}
    }

    // Random factor
    const rand=0.85+Math.random()*0.15;

    // Weather
    let weatherMult=1;
    if(weatherTurns>0){
      if(md.type==='Water')weatherMult=1.5;
      if(md.type==='Fire')weatherMult=0.5;
    }

    // Burn halves physical damage (already factored into atk via getEffStat for atk)
    // Actually burn halves the damage of physical moves, let's apply it here directly
    let burnMult=1;
    if(atkState.status==='BRN'&&md.cat==='Physical'&&!md.foulPlay) burnMult=0.5;

    let baseDmg=Math.floor(((2*50/5+2)*power*aStat/dStat)/50+2);
    let modifier=stab*typeEff*critMult*rand*weatherMult*burnMult;
    let damage=Math.max(1,Math.floor(baseDmg*modifier));

    totalDmg+=damage;
    defState.hp=Math.max(0,defState.hp-damage);

    if(attackerWho==='player') battleStats.playerDmg+=damage;
    else battleStats.oppDmg+=damage;

    // Animations
    shakeSprite(defenderWho);
    if(typeEff>=2){
      flashSprite(defenderWho);
      sfxSuperHit();
    } else if(typeEff<1){
      sfxNveHit();
    } else {
      sfxHit();
    }

    updateHpBar(defenderWho);
    await delay(300);

    if(isCrit) addLog('A critical hit!','log-crit');

    if(typeEff>=4){addLog('It\'s super effective!! (4x)','log-super');battleStats.superEffHits++;}
    else if(typeEff>=2){addLog('It\'s super effective!','log-super');battleStats.superEffHits++;}
    else if(typeEff<=0.25) addLog('It\'s not very effective... (\u00BCx)','log-nve');
    else if(typeEff<1) addLog('It\'s not very effective...','log-nve');

    if(hits>1) addLog('Hit '+(h+1)+' of '+hits+'!');

    if(defState.hp<=0) break;
  }

  addLog(defPoke.name+' lost '+totalDmg+' HP!','log-damage');

  // Drain
  if(md.drain&&totalDmg>0){
    const heal=Math.max(1,Math.floor(totalDmg*md.drain));
    atkState.hp=Math.min(atkState.maxHp,atkState.hp+heal);
    addLog(atkPoke.name+' restored '+heal+' HP!','log-heal');
    updateHpBar(attackerWho);
  }

  // Recoil
  if(md.recoil&&totalDmg>0){
    const recoilDmg=Math.max(1,Math.floor(totalDmg*md.recoil));
    atkState.hp=Math.max(0,atkState.hp-recoilDmg);
    addLog(atkPoke.name+' was hurt by recoil! ('+recoilDmg+' HP)');
    updateHpBar(attackerWho);
    if(atkState.hp<=0){await handleFaint(attackerWho);return;}
  }

  // Recharge
  if(md.recharge) atkState.recharging=true;

  // Self stat changes
  if(md.selfStat){
    for(let s in md.selfStat){
      applyStatChange(atkState,s,md.selfStat[s],attackerWho,atkPoke.name);
    }
  }

  // Petal Dance
  if(md.lockIn){
    if(atkState.petalTurns<=0) atkState.petalTurns=Math.random()<0.5?2:3;
    atkState.petalTurns--;
    if(atkState.petalTurns<=0){
      atkState.confused=true;
      atkState.confuseTurns=2+Math.floor(Math.random()*3);
      addLog(atkPoke.name+' became confused due to fatigue!','log-status');
      updateStatus(attackerWho);
    }
  }

  // Secondary effects on defender
  if(md.secondary&&defState.hp>0){
    const sec=md.secondary;
    if(sec.status&&Math.random()*100<sec.chance){
      if(!defState.status){
        defState.status=sec.status;
        if(sec.status==='SLP') defState.statusTurns=1+Math.floor(Math.random()*3);
        addLog(defPoke.name+' was '+statusVerb(sec.status)+'!','log-status');
        updateStatus(defenderWho);
      }
    }
    if(sec.flinch&&Math.random()*100<sec.chance){
      defState.flinched=true;
    }
    if(sec.stat&&Math.random()*100<sec.chance){
      for(let s in sec.stat){
        applyStatChange(defState,s,sec.stat[s],defenderWho,defPoke.name);
      }
    }
    if(sec.confuse&&Math.random()*100<sec.chance){
      if(!defState.confused){
        defState.confused=true;
        defState.confuseTurns=2+Math.floor(Math.random()*3);
        addLog(defPoke.name+' became confused!','log-status');
        updateStatus(defenderWho);
      }
    }
    if(sec.allBoost&&Math.random()*100<sec.chance){
      ['atk','def','spa','spd','spe'].forEach(s=>applyStatChange(atkState,s,1,attackerWho,atkPoke.name));
    }
  }

  // Fire Spin
  if(md.effect==='firespin'&&defState.hp>0){
    if(defState.fireSpinTurns<=0){
      defState.fireSpinTurns=4+Math.floor(Math.random()*2);
      addLog(defPoke.name+' was trapped in a fire spin!','log-status');
    }
  }

  await delay(300);

  // Check faint
  if(defState.hp<=0){await handleFaint(defenderWho);return;}
  if(atkState.hp<=0){await handleFaint(attackerWho);return;}
}

function calcConfusionDmg(state){
  const power=40;
  const a=getEffStat(state,'atk');
  const d=getEffStat(state,'def');
  const baseDmg=Math.floor(((2*50/5+2)*power*a/d)/50+2);
  return Math.max(1,Math.floor(baseDmg*(0.85+Math.random()*0.15)));
}

async function handleStatusMove(atkWho,defWho,moveName,md){
  const atkState2=atkWho==='player'?playerState:oppState;
  const defState2=defWho==='player'?playerState:oppState;
  const atkPoke2=atkWho==='player'?playerPoke:oppPoke;
  const defPoke2=defWho==='player'?playerPoke:oppPoke;

  // Accuracy check
  if(md.acc!==null){
    const accMult=getEffAcc(atkState2);
    if(Math.random()>md.acc*accMult/100){
      addLog(atkPoke2.name+'\'s move missed!');
      return;
    }
  }

  // Self stat boosts
  if(md.selfStat){
    for(let s in md.selfStat){
      applyStatChange(atkState2,s,md.selfStat[s],atkWho,atkPoke2.name);
    }
  }

  // Target stat drops
  if(md.targetStat){
    for(let s in md.targetStat){
      applyStatChange(defState2,s,md.targetStat[s],defWho,defPoke2.name);
    }
  }

  // Status effects
  if(md.effect==='sleep'){
    if(!defState2.status){
      defState2.status='SLP';
      defState2.statusTurns=1+Math.floor(Math.random()*3);
      addLog(defPoke2.name+' fell asleep!','log-status');
      updateStatus(defWho);
    } else {addLog('But it failed!');}
  }
  if(md.effect==='paralyze'){
    if(!defState2.status){
      defState2.status='PAR';
      addLog(defPoke2.name+' was paralyzed!','log-status');
      updateStatus(defWho);
    } else {addLog('But it failed!');}
  }
  if(md.effect==='toxic'){
    if(!defState2.status){
      defState2.status='TOX';
      defState2.toxicCounter=1;
      addLog(defPoke2.name+' was badly poisoned!','log-status');
      updateStatus(defWho);
    } else {addLog('But it failed!');}
  }
  if(md.effect==='confuse'){
    if(!defState2.confused){
      defState2.confused=true;
      defState2.confuseTurns=2+Math.floor(Math.random()*3);
      addLog(defPoke2.name+' became confused!','log-status');
      updateStatus(defWho);
    } else {addLog('But it failed!');}
  }
  if(md.effect==='leechseed'){
    if(!defState2.leechSeed){
      defState2.leechSeed=true;
      addLog(defPoke2.name+' was seeded!','log-status');
    } else {addLog('But it failed!');}
  }
  if(md.effect==='rain'){
    weatherTurns=5;
    addLog('It started to rain!','log-status');
    document.getElementById('weatherBanner').textContent='Rain ('+weatherTurns+' turns)';
    document.getElementById('weatherBanner').classList.add('active');
  }
}

function statusVerb(s){
  switch(s){
    case 'BRN':return 'burned';
    case 'PSN':return 'poisoned';
    case 'PAR':return 'paralyzed';
    case 'FRZ':return 'frozen';
    case 'SLP':return 'put to sleep';
    default:return 'afflicted';
  }
}

function applyStatChange(state,stat,amount,who,name){
  const old=state.stages[stat];
  state.stages[stat]=Math.max(-6,Math.min(6,old+amount));
  const diff=state.stages[stat]-old;
  if(diff===0){
    const statName=stat.toUpperCase();
    addLog(name+'\'s '+statName+' can\'t go any '+(amount>0?'higher':'lower')+'!');
    return;
  }
  const statName=stat.toUpperCase();
  const arrow=diff>0?'\u2191':'\u2193';
  const word=Math.abs(diff)>=2?'sharply ':'';
  const dir=diff>0?'rose':'fell';
  addLog(name+'\'s '+statName+' '+word+dir+'!','log-status');
  floatText(who,statName+' '+arrow.repeat(Math.abs(diff)),diff>0?'#00b894':'#e74c3c');
  updateStatChanges(who);
}

async function endOfTurnEffects(){
  for(let who of ['player','opp']){
    const state=who==='player'?playerState:oppState;
    const poke=who==='player'?playerPoke:oppPoke;
    const otherState=who==='player'?oppState:playerState;
    const otherPoke=who==='player'?oppPoke:playerPoke;
    const otherWho=who==='player'?'opp':'player';

    if(state.hp<=0)continue;

    // Burn damage
    if(state.status==='BRN'){
      const dmg=Math.max(1,Math.floor(state.maxHp/16));
      state.hp=Math.max(0,state.hp-dmg);
      addLog(poke.name+' was hurt by its burn! ('+dmg+' HP)','log-status');
      updateHpBar(who);
      if(state.hp<=0){await handleFaint(who);if(battleOver)return;continue;}
    }
    // Poison damage
    if(state.status==='PSN'){
      const dmg=Math.max(1,Math.floor(state.maxHp/8));
      state.hp=Math.max(0,state.hp-dmg);
      addLog(poke.name+' was hurt by poison! ('+dmg+' HP)','log-status');
      updateHpBar(who);
      if(state.hp<=0){await handleFaint(who);if(battleOver)return;continue;}
    }
    // Toxic damage
    if(state.status==='TOX'){
      state.toxicCounter++;
      const dmg=Math.max(1,Math.floor(state.maxHp*state.toxicCounter/16));
      state.hp=Math.max(0,state.hp-dmg);
      addLog(poke.name+' was hurt by toxic! ('+dmg+' HP)','log-status');
      updateHpBar(who);
      if(state.hp<=0){await handleFaint(who);if(battleOver)return;continue;}
    }
    // Leech Seed
    if(state.leechSeed&&otherState.hp>0){
      const dmg=Math.max(1,Math.floor(state.maxHp/8));
      state.hp=Math.max(0,state.hp-dmg);
      const heal=Math.min(dmg,otherState.maxHp-otherState.hp);
      otherState.hp=Math.min(otherState.maxHp,otherState.hp+heal);
      addLog('Leech Seed saps '+poke.name+'! ('+dmg+' HP)','log-status');
      if(heal>0) addLog(otherPoke.name+' restored '+heal+' HP!','log-heal');
      updateHpBar(who);
      updateHpBar(otherWho);
      if(state.hp<=0){await handleFaint(who);if(battleOver)return;continue;}
    }
    // Fire Spin
    if(state.fireSpinTurns>0){
      state.fireSpinTurns--;
      const dmg=Math.max(1,Math.floor(state.maxHp/8));
      state.hp=Math.max(0,state.hp-dmg);
      addLog(poke.name+' is hurt by Fire Spin! ('+dmg+' HP)','log-status');
      updateHpBar(who);
      if(state.fireSpinTurns<=0) addLog(poke.name+' was freed from Fire Spin!');
      if(state.hp<=0){await handleFaint(who);if(battleOver)return;continue;}
    }
  }

  // Weather countdown
  if(weatherTurns>0){
    weatherTurns--;
    if(weatherTurns<=0){
      addLog('The rain stopped.','log-status');
      document.getElementById('weatherBanner').classList.remove('active');
    } else {
      document.getElementById('weatherBanner').textContent='Rain ('+weatherTurns+' turns)';
    }
  }

  await delay(200);
}

async function handleFaint(who){
  const poke=who==='player'?playerPoke:oppPoke;
  addLog(poke.name+' fainted!','log-faint');
  faintSprite(who);
  sfxFaint();
  await delay(1000);
  battleOver=true;

  if(who==='opp'){
    showResult(true);
  } else {
    showResult(false);
  }
}

function showResult(victory){
  document.getElementById('battleScreen').style.display='none';
  document.getElementById('resultScreen').style.display='block';
  const title=document.getElementById('resultTitle');
  if(victory){
    title.textContent='VICTORY!';
    title.className='result-title victory';
    drawSprite('resultCanvas',playerPoke.id,false);
    sfxVictory();
  } else {
    title.textContent='DEFEAT...';
    title.className='result-title defeat';
    drawSprite('resultCanvas',oppPoke.id,true);
  }

  const stats=document.getElementById('resultStats');
  stats.innerHTML=
    '<div class="rs-row"><span class="rs-label">Turns</span><span class="rs-val">'+battleStats.turns+'</span></div>'
    +'<div class="rs-row"><span class="rs-label">Damage Dealt</span><span class="rs-val">'+battleStats.playerDmg+'</span></div>'
    +'<div class="rs-row"><span class="rs-label">Damage Taken</span><span class="rs-val">'+battleStats.oppDmg+'</span></div>'
    +'<div class="rs-row"><span class="rs-label">Super Effective Hits</span><span class="rs-val">'+battleStats.superEffHits+'</span></div>'
    +'<div class="rs-row"><span class="rs-label">Your HP Remaining</span><span class="rs-val">'+(playerState.hp>0?playerState.hp:0)+' / '+playerState.maxHp+'</span></div>';
}
