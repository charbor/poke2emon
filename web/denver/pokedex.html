<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denver Pokedex</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'VT323',monospace;
  background:linear-gradient(135deg,#1a1a2e 0%,#0f3460 100%);
  color:#e0e0e0;
  min-height:100vh;
  padding:0 0 60px;
  font-size:18px;
}
header{
  text-align:center;
  padding:40px 20px 20px;
}
header h1{
  font-family:'Press Start 2P',cursive;
  font-size:clamp(18px,4vw,36px);
  color:#fdcb6e;
  text-shadow:0 0 20px rgba(253,203,110,.4);
  margin-bottom:10px;
  letter-spacing:2px;
}
header p{
  font-size:clamp(16px,2.5vw,24px);
  color:#a29bfe;
  font-style:italic;
}
.top-bar{
  position:sticky;
  top:0;
  z-index:100;
  background:linear-gradient(135deg,#1a1a2e 0%,#0f3460 100%);
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  padding-bottom:12px;
}
.top-bar header{padding:16px 20px 8px;}
.controls{
  max-width:1200px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:center;
}
.controls input[type=text]{
  font-family:'VT323',monospace;
  font-size:20px;
  padding:8px 16px;
  border:2px solid #a29bfe;
  border-radius:8px;
  background:#16213e;
  color:#e0e0e0;
  outline:none;
  width:220px;
  transition:border-color .2s;
}
.controls input[type=text]:focus{border-color:#fdcb6e;}
.filter-btn{
  font-family:'VT323',monospace;
  font-size:18px;
  padding:6px 14px;
  border:2px solid #555;
  border-radius:6px;
  background:#16213e;
  color:#b2bec3;
  cursor:pointer;
  transition:all .2s;
}
.filter-btn:hover,.filter-btn.active{
  border-color:#fdcb6e;
  color:#fdcb6e;
  background:#1a1a2e;
}
.type-select{
  font-family:'VT323',monospace;
  font-size:18px;
  padding:6px 12px;
  border:2px solid #555;
  border-radius:6px;
  background:#16213e;
  color:#b2bec3;
  cursor:pointer;
  outline:none;
}
.grid{
  max-width:1200px;
  margin:20px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:24px;
}
.card{
  background:linear-gradient(145deg,#16213e,#1a1a2e);
  border:2px solid #2d3436;
  border-radius:16px;
  padding:20px;
  transition:transform .25s,box-shadow .25s;
  position:relative;
  overflow:hidden;
  cursor:pointer;
}
.card.flipped .pokemon-mode-content{display:none !important;}
.card.flipped .real-mode-content{display:block !important;}
.card:not(.flipped) .pokemon-mode-content{display:block;}
.card:not(.flipped) .real-mode-content{display:none;}
body.real-view .card:not(.flipped) .pokemon-mode-content{display:none;}
body.real-view .card:not(.flipped) .real-mode-content{display:block;}
body.real-view .card.flipped .pokemon-mode-content{display:block !important;}
body.real-view .card.flipped .real-mode-content{display:none !important;}
.card.hidden{display:none;}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 8px 30px rgba(162,155,254,.25);
  border-color:#a29bfe;
}
.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.card-number{
  font-family:'Press Start 2P',cursive;
  font-size:12px;
  color:#636e72;
}
.type-badges{display:flex;gap:6px;flex-wrap:wrap;}
.type-badge{
  font-family:'VT323',monospace;
  font-size:14px;
  padding:2px 8px;
  border-radius:4px;
  color:#fff;
  text-transform:uppercase;
  letter-spacing:1px;
}
.sprite-container{
  display:flex;
  justify-content:center;
  margin:10px 0;
}
.sprite-container canvas{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:192px;
  height:192px;
}
.pokemon-sprite{
  width:192px;
  height:192px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.pokemon-sprite-mini{
  width:72px;
  height:72px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.evo-sprite-img{
  width:64px;
  height:64px;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.card-name{
  font-family:'Press Start 2P',cursive;
  font-size:14px;
  color:#dfe6e9;
  margin:8px 0 2px;
}
.card-title{
  font-size:16px;
  color:#636e72;
  margin-bottom:6px;
}
.card-desc{
  font-size:17px;
  color:#b2bec3;
  line-height:1.3;
  margin-bottom:10px;
  font-style:italic;
}
.moves-list{
  background:#0d1b2a;
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:10px;
}
.moves-list .move-title{
  font-size:14px;
  color:#636e72;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:1px;
}
.move-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:3px 0;
  cursor:default;
  position:relative;
}
.move-name{font-size:18px;color:#dfe6e9;flex:1;}
.move-type-badge{
  font-size:12px;
  padding:1px 6px;
  border-radius:3px;
  color:#fff;
  text-transform:uppercase;
}
.move-info{
  font-size:16px;
  color:#636e72;
  cursor:help;
  position:relative;
}
.tooltip::after{
  content:'';
  position:absolute;
  top:100%;
  right:12px;
  border:6px solid transparent;
  border-top-color:#555;
}
.move-row:hover .tooltip{display:block;}
.evo-chain{
  text-align:center;
  margin:10px 0;
  padding:10px 0;
  border-top:1px solid #2d3436;
}
.evo-label{
  font-size:13px;
  color:#636e72;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:8px;
}
.evo-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.evo-sprite{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}
.evo-sprite canvas{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:72px;
  height:72px;
}
.evo-sprite span{
  font-size:13px;
  color:#b2bec3;
}
.evo-sprite.current span{color:#fdcb6e;font-weight:bold;}
.evo-arrow{
  font-size:24px;
  color:#636e72;
  margin:0 2px;
}
.real-species{
  border-top:1px solid #2d3436;
  margin-top:8px;
  padding-top:8px;
}
.real-toggle{
  background:none;
  border:none;
  color:#636e72;
  font-family:'VT323',monospace;
  font-size:18px;
  cursor:pointer;
  transition:color .2s;
  padding:2px 0;
}
.real-toggle:hover{color:#a29bfe;}
.real-content{
  display:none;
  margin-top:8px;
  padding:10px;
  background:#0d1b2a;
  border-radius:8px;
  border:1px solid #2d3436;
}
.real-content.open{display:block;}
.real-content .rname{font-size:18px;color:#dfe6e9;font-weight:bold;}
.real-content .rsci{font-size:16px;color:#a29bfe;font-style:italic;margin:2px 0;}
.real-content .rfact{font-size:16px;color:#b2bec3;margin-top:4px;}
/* === View Toggle Button === */
.view-toggle{
  display:inline-flex;
  border:2px solid #a29bfe;
  border-radius:20px;
  overflow:hidden;
  margin-left:10px;
}
.view-toggle button{
  font-family:'VT323',monospace;
  font-size:18px;
  padding:6px 16px;
  border:none;
  cursor:pointer;
  transition:all .25s;
  background:#16213e;
  color:#b2bec3;
}
.view-toggle button.active{
  background:linear-gradient(135deg,#a29bfe,#6c5ce7);
  color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.3);
}
.view-toggle button:first-child{border-radius:18px 0 0 18px;}
.view-toggle button:last-child{border-radius:0 18px 18px 0;}
.view-toggle button:hover:not(.active){
  background:#1a1a2e;
  color:#fdcb6e;
}

/* === Wiki Image Styles === */
.wiki-img-wrap{
  text-align:center;
  margin:8px 0;
}
.wiki-img-wrap img{
  width:180px;
  max-width:100%;
  border-radius:10px;
  border:2px solid #2d3436;
  display:block;
  margin:0 auto;
  background:#0d1b2a;
}
.wiki-img-wrap .img-spinner{
  width:180px;
  height:120px;
  margin:0 auto;
  border-radius:10px;
  background:#0d1b2a;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #2d3436;
}
.wiki-img-wrap .img-spinner::after{
  content:'';
  width:28px;height:28px;
  border:3px solid #636e72;
  border-top-color:#a29bfe;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.wiki-img-wrap .img-fail{
  width:180px;
  height:80px;
  margin:0 auto;
  border-radius:10px;
  background:#0d1b2a;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px dashed #2d3436;
  color:#636e72;
  font-size:14px;
}

/* === Enhanced Tooltip === */
.tooltip{
  display:none;
  position:absolute;
  bottom:calc(100% + 8px);
  right:0;
  width:280px;
  background:#0d1b2a;
  border:2px solid #555;
  border-radius:8px;
  padding:10px 12px;
  font-size:15px;
  color:#dfe6e9;
  line-height:1.3;
  z-index:100;
  pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
.tooltip .tt-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
}
.tooltip .tt-move-name{
  font-family:'Press Start 2P',cursive;
  font-size:10px;
  color:#fdcb6e;
  text-transform:uppercase;
}
.tooltip .tt-type-badge{
  font-size:12px;
  padding:1px 6px;
  border-radius:3px;
  color:#fff;
  text-transform:uppercase;
}
.tooltip .tt-stats{
  font-size:15px;
  color:#b2bec3;
  margin:4px 0;
}
.tooltip .tt-category{
  font-size:15px;
  margin:2px 0;
}
.tooltip .tt-category.physical{color:#e17055;}
.tooltip .tt-category.special{color:#a29bfe;}
.tooltip .tt-category.status{color:#00b894;}
.tooltip .tt-divider{
  border:none;
  border-top:1px solid #2d3436;
  margin:6px 0;
}
.tooltip .tt-desc{
  font-size:14px;
  color:#b2bec3;
  line-height:1.4;
}

/* === Real-Mode Card Content === */
.real-mode-content{
  display:none;
}

.real-mode-content .real-hero-img{
  text-align:center;
  margin:10px 0;
}
.real-mode-content .real-hero-img img{
  width:220px;
  max-width:100%;
  border-radius:12px;
  border:2px solid #a29bfe;
  box-shadow:0 4px 20px rgba(162,155,254,.2);
}
.real-mode-content .real-hero-img .img-spinner{
  width:220px;
  height:140px;
  margin:0 auto;
  border-radius:12px;
  background:#0d1b2a;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #a29bfe;
}
.real-mode-content .real-hero-img .img-spinner::after{
  content:'';
  width:32px;height:32px;
  border:3px solid #636e72;
  border-top-color:#a29bfe;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
.real-mode-content .real-hero-img .img-fail{
  width:220px;
  height:80px;
  margin:0 auto;
  border-radius:12px;
  background:#0d1b2a;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px dashed #a29bfe;
  color:#636e72;
  font-size:14px;
}
.real-mode-content .real-main-name{
  font-family:'Press Start 2P',cursive;
  font-size:14px;
  color:#dfe6e9;
  margin:8px 0 2px;
}
.real-mode-content .real-main-sci{
  font-size:18px;
  color:#a29bfe;
  font-style:italic;
  margin-bottom:4px;
}
.real-mode-content .real-main-fact{
  font-size:17px;
  color:#b2bec3;
  line-height:1.3;
  margin-bottom:10px;
  font-style:italic;
}
.real-mode-content .pokemon-collapsed{
  border-top:1px solid #2d3436;
  margin-top:8px;
  padding-top:8px;
}
.real-mode-content .pokemon-collapsed .poke-toggle{
  background:none;
  border:none;
  color:#636e72;
  font-family:'VT323',monospace;
  font-size:18px;
  cursor:pointer;
  transition:color .2s;
  padding:2px 0;
}
.real-mode-content .pokemon-collapsed .poke-toggle:hover{color:#a29bfe;}
.real-mode-content .pokemon-collapsed .poke-inner{
  display:none;
  margin-top:8px;
  padding:10px;
  background:#0d1b2a;
  border-radius:8px;
  border:1px solid #2d3436;
}
.real-mode-content .pokemon-collapsed .poke-inner.open{display:block;}
.real-mode-content .pokemon-collapsed .poke-inner .mini-sprite{
  display:flex;
  justify-content:center;
  margin:6px 0;
}
.real-mode-content .pokemon-collapsed .poke-inner .mini-sprite canvas{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:96px;
  height:96px;
}
.real-mode-content .pokemon-collapsed .poke-inner .poke-name{
  font-family:'Press Start 2P',cursive;
  font-size:12px;
  color:#fdcb6e;
  margin:4px 0 2px;
}
.real-mode-content .pokemon-collapsed .poke-inner .poke-title{
  font-size:15px;
  color:#636e72;
}
.real-mode-content .pokemon-collapsed .poke-inner .poke-desc{
  font-size:15px;
  color:#b2bec3;
  margin-top:4px;
  font-style:italic;
}

/* fade transition for toggle */
.pokemon-mode-content, .real-mode-content{
  transition:opacity .3s ease;
}
body.real-view .real-mode-content{
  animation:fadeIn .35s ease;
}
body:not(.real-view) .pokemon-mode-content{
  animation:fadeIn .35s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:420px){
  .grid{grid-template-columns:1fr;padding:0 10px;}
  .card{padding:14px;}
  header h1{font-size:16px;}
  .view-toggle button{padding:6px 10px;font-size:16px;}
}

/* ===== Scanner Modal ===== */
.scan-btn:hover{background:#00b894 !important;color:#fff !important;}
#scanModal{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.85);z-index:9999;
  justify-content:center;align-items:center;
}
#scanModal.open{display:flex;}
.scan-box{
  background:linear-gradient(145deg,#16213e,#1a1a2e);
  border:2px solid #00b894;border-radius:20px;
  padding:30px;max-width:500px;width:90%;
  text-align:center;position:relative;
  box-shadow:0 0 40px rgba(0,184,148,.2);
}
.scan-box h2{
  font-family:'Press Start 2P',cursive;font-size:16px;
  color:#00b894;margin-bottom:20px;
  text-shadow:0 0 12px rgba(0,184,148,.4);
}
.scan-close{
  position:absolute;top:12px;right:16px;
  background:none;border:none;color:#636e72;
  font-size:28px;cursor:pointer;font-family:'VT323',monospace;
}
.scan-close:hover{color:#e17055;}
.scan-drop{
  border:3px dashed #2d3436;border-radius:14px;
  padding:40px 20px;margin:16px 0;cursor:pointer;
  transition:border-color .2s,background .2s;
  position:relative;
}
.scan-drop:hover,.scan-drop.dragover{
  border-color:#00b894;background:rgba(0,184,148,.05);
}
.scan-drop-text{color:#636e72;font-size:20px;}
.scan-drop-text span{color:#00b894;text-decoration:underline;cursor:pointer;}
.scan-or{color:#636e72;font-size:16px;margin:10px 0;}
.scan-cam-btn{
  font-family:'VT323',monospace;font-size:20px;
  padding:10px 24px;border:2px solid #a29bfe;border-radius:10px;
  background:#16213e;color:#a29bfe;cursor:pointer;
  transition:all .2s;
}
.scan-cam-btn:hover{background:#a29bfe;color:#fff;}
.scan-preview{
  margin:16px 0;border-radius:10px;overflow:hidden;
  display:none;position:relative;
}
.scan-preview img,.scan-preview video{
  width:100%;max-height:300px;object-fit:contain;
  border-radius:10px;
}
.scan-preview canvas{display:none;}
.scan-go{
  font-family:'Press Start 2P',cursive;font-size:14px;
  padding:12px 32px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#00b894,#00cec9);
  color:#fff;cursor:pointer;display:none;
  transition:transform .2s,box-shadow .2s;
  margin-top:8px;
}
.scan-go:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(0,184,148,.4);}
.scan-go:disabled{opacity:.5;cursor:wait;transform:none;}
.scan-result{
  margin-top:16px;padding:16px;
  background:#0d1b2a;border-radius:10px;
  border:1px solid #2d3436;display:none;
  text-align:left;
}
.scan-result.show{display:block;}
.scan-result .match-name{
  font-family:'Press Start 2P',cursive;font-size:14px;
  color:#fdcb6e;margin-bottom:6px;
}
.scan-result .match-real{color:#00b894;font-size:18px;}
.scan-result .match-conf{color:#a29bfe;font-size:16px;margin-top:4px;}
.scan-result .match-reason{color:#b2bec3;font-size:16px;margin-top:8px;}
.scan-result .match-none{color:#e17055;font-size:18px;}
.scan-result .match-go-btn{
  font-family:'VT323',monospace;font-size:18px;
  padding:6px 16px;border:2px solid #fdcb6e;border-radius:8px;
  background:transparent;color:#fdcb6e;cursor:pointer;
  margin-top:10px;transition:all .2s;
}
.scan-result .match-go-btn:hover{background:#fdcb6e;color:#1a1a2e;}
.scan-api-setup{
  margin-top:12px;padding:12px;
  background:#0d1b2a;border-radius:8px;
  border:1px solid #2d3436;
}
.scan-api-setup label{color:#b2bec3;font-size:16px;}
.scan-api-setup input{
  font-family:'VT323',monospace;font-size:18px;
  padding:6px 12px;border:2px solid #2d3436;border-radius:6px;
  background:#16213e;color:#e0e0e0;width:100%;margin-top:6px;
  outline:none;
}
.scan-api-setup input:focus{border-color:#00b894;}
.scan-api-setup .api-hint{color:#636e72;font-size:14px;margin-top:4px;}
.scan-spinner{
  display:inline-block;width:20px;height:20px;
  border:3px solid #2d3436;border-top-color:#00b894;
  border-radius:50%;animation:spin .8s linear infinite;
  vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="top-bar">
<header>
<h1>DENVER POKEDEX</h1>
<p>Gotta Catch 'em All &mdash; Front Range Edition</p>
</header>
<div class="controls">
<input type="text" id="search" placeholder="Search Pokemon...">
<button class="filter-btn active" data-cat="All">All</button>
<button class="filter-btn" data-cat="Flora">Flora</button>
<button class="filter-btn" data-cat="Mammals">Mammals</button>
<button class="filter-btn" data-cat="Birds">Birds</button>
<button class="filter-btn" data-cat="Reptiles & Insects">Reptiles &amp; Insects</button>
<div class="view-toggle" id="viewToggle">
<button class="active" data-view="pokemon">&#127918; Pokemon</button>
<button data-view="real">&#128247; Real</button>
</div>
<button class="filter-btn scan-btn" id="scanBtn" style="border-color:#00b894;color:#00b894;font-size:20px;">&#128247; SCAN</button>
<select class="type-select" id="typeFilter">
<option value="All">All Types</option>
<option value="Grass">Grass</option>
<option value="Fire">Fire</option>
<option value="Ice">Ice</option>
<option value="Water">Water</option>
<option value="Ground">Ground</option>
<option value="Normal">Normal</option>
<option value="Flying">Flying</option>
<option value="Bug">Bug</option>
<option value="Dark">Dark</option>
<option value="Poison">Poison</option>
<option value="Electric">Electric</option>
<option value="Rock">Rock</option>
<option value="Ghost">Ghost</option>
<option value="Fairy">Fairy</option>
</select>
</div>
</div>
<div class="grid" id="grid"></div>

const wikiImages={};

async function fetchWikiImage(title){
  try{
    const resp=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));
    const data=await resp.json();
    return data.thumbnail?data.thumbnail.source:null;
  }catch(e){return null;}
}

async function loadAllWikiImages(){
  const promises=POKEMON.map(async p=>{
    const wikiTitle=WIKI_MAP[p.id];
    if(!wikiTitle)return;
    const url=await fetchWikiImage(wikiTitle);
    wikiImages[p.id]=url;
    // Update the spinner placeholders in both pokemon-mode and real-mode
    document.querySelectorAll('.wiki-img-slot-'+p.id).forEach(slot=>{
      if(url){
        slot.innerHTML='<img src="'+url+'" alt="'+p.real.name+'" loading="lazy">';
      }else{
        slot.innerHTML='<div class="img-fail">Image unavailable</div>';
      }
    });
  });
  await Promise.all(promises);
}

/* ===== Pixel Art Helpers ===== */
function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w||1,h||1);}
function rect(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function eye(ctx,x,y,s,pc,hc){
  rect(ctx,x,y,s,s,'#fff');
  var ps=Math.max(1,Math.floor(s*0.5));
  rect(ctx,x+s-ps,y+s-ps,ps,ps,pc||'#111');
  if(s>=3)px(ctx,x+1,y,1,1,hc||'#aee');
  else if(s>=2)px(ctx,x,y,1,1,hc||'#aee');
}
function bigEye(ctx,x,y,s,pc,hc){
  rect(ctx,x,y,s,s,'#fff');
  var ps=Math.max(1,Math.floor(s*0.45));
  rect(ctx,x+s-ps-1,y+s-ps,ps,ps,pc||'#111');
  px(ctx,x+1,y+1,Math.max(1,Math.floor(s*0.3)),Math.max(1,Math.floor(s*0.3)),hc||'#aee');
}

  rect(ctx,3,6,8,8,'#e17055');rect(ctx,4,7,6,6,'#f39c12');
  rect(ctx,13,6,8,8,'#e17055');rect(ctx,14,7,6,6,'#f39c12');
  px(ctx,3,6,1,8,'#111');px(ctx,20,6,1,8,'#111');
  px(ctx,4,14,6,1,'#111');px(ctx,14,14,6,1,'#111');
  px(ctx,4,6,6,1,'#111');px(ctx,14,6,6,1,'#111');
  px(ctx,3,8,1,1,'#fff');px(ctx,3,12,1,1,'#fff');px(ctx,20,8,1,1,'#fff');px(ctx,20,12,1,1,'#fff');
  px(ctx,10,4,1,3,'#111');px(ctx,13,4,1,3,'#111');px(ctx,9,3,2,1,'#f39c12');px(ctx,13,3,2,1,'#f39c12');
  px(ctx,11,8,1,1,'#fff');px(ctx,12,8,1,1,'#fff');
};

/* ===== Build Cards ===== */
function buildTooltip(m,md){
  if(!md) return '<div class="tooltip">No data available.</div>';
  const tc=TYPE_COLORS[md.type]||'#636e72';
  const catIcon=md.cat==='Physical'?'\u2694\uFE0F':md.cat==='Special'?'\u2728':'\uD83D\uDD04';
  const catClass=md.cat.toLowerCase();
  const pwrStr=md.power!==null?md.power:'\u2014';
  const accStr=md.acc!==null?md.acc+'%':'\u2014';
  return '<div class="tooltip" style="border-color:'+tc+'">'
    +'<div class="tt-header"><span class="tt-move-name">'+m+'</span><span class="tt-type-badge" style="background:'+tc+'">'+md.type+'</span></div>'
    +'<div class="tt-stats">Power: '+pwrStr+'&nbsp;&nbsp;Acc: '+accStr+'</div>'
    +'<div class="tt-category '+catClass+'">'+catIcon+' '+md.cat+'</div>'
    +'<hr class="tt-divider">'
    +'<div class="tt-desc">'+md.desc+'</div>'
    +'</div>';
}

function buildCards(){
  const grid=document.getElementById('grid');
  POKEMON.forEach(p=>{
    const card=document.createElement('div');
    card.className='card';
    card.dataset.id=p.id;
    card.dataset.cat=p.cat;
    card.dataset.types=p.types.join(',');
    card.dataset.name=p.name.toLowerCase();
    card.dataset.realname=(p.real.name+' '+p.real.sci).toLowerCase();
    card.dataset.wiki=WIKI_MAP[p.id]||'';

    let hdr='<div class="card-header"><span class="card-number">#'+String(p.id).padStart(3,'0')+'</span><div class="type-badges">';
    p.types.forEach(t=>{hdr+='<span class="type-badge" style="background:'+TYPE_COLORS[t]+'">'+t+'</span>';});
    hdr+='</div></div>';

    // --- Pokemon Mode Content ---
    let pokContent='<div class="pokemon-mode-content">';
    pokContent+='<div class="sprite-container"><img class="pokemon-sprite" src="sprites/'+p.name.toLowerCase()+'.png?v=2" alt="'+p.name+'"></div>';
    pokContent+='<div class="card-name">'+p.name+'</div><div class="card-title">'+p.title+'</div><div class="card-desc">\u201C'+p.desc+'\u201D</div>';

    let mvs='<div class="moves-list"><div class="move-title">Moves</div>';
    p.moves.forEach(m=>{
      const md=MOVES[m];
      const tc=md?TYPE_COLORS[md.type]:'#636e72';
      const mtype=md?md.type:'';
      mvs+='<div class="move-row"><span class="move-name">'+m+'</span><span class="move-type-badge" style="background:'+tc+'">'+mtype+'</span><span class="move-info">\u2139'+buildTooltip(m,md)+'</span></div>';
    });
    mvs+='</div>';
    pokContent+=mvs;

    let evo='';
    if(p.evo){
      evo='<div class="evo-chain"><div class="evo-label">Evolution Chain</div><div class="evo-row">';
      p.evo.chain.forEach((name,i)=>{
        if(i>0) evo+='<span class="evo-arrow">\u2192</span>';
        const cls=i===p.evo.current?'evo-sprite current':'evo-sprite';
        evo+='<div class="'+cls+'"><img class="evo-sprite-img" src="sprites/'+name.toLowerCase()+'.png?v=2" alt="'+name+'"><span>'+name+'</span></div>';
      });
      evo+='</div></div>';
    }
    pokContent+=evo;

    pokContent+='</div>';

    // --- Real Mode Content ---
    let realContent='<div class="real-mode-content">';
    realContent+='<div class="real-hero-img wiki-img-slot-'+p.id+'"><div class="img-spinner"></div></div>';
    realContent+='<div class="real-main-name">'+p.real.name+'</div>';
    realContent+='<div class="real-main-sci">'+p.real.sci+'</div>';
    realContent+='<div class="real-main-fact">\u201C'+p.real.fact+'\u201D</div>';

    realContent+='</div>';

    card.innerHTML=hdr+pokContent+realContent;
    card.addEventListener('click',function(e){
      if(e.target.closest('.move-info,.tooltip'))return;
      this.classList.toggle('flipped');
    });
    grid.appendChild(card);
  });
}

function drawSprites(){
  POKEMON.forEach(p=>{
    const c=document.getElementById('sprite-'+p.id);
    if(c&&SPRITES[p.id]){
      const ctx=c.getContext('2d');
      ctx.clearRect(0,0,48,48);
      SPRITES[p.id](ctx);
    }
    // Draw real-mode mini sprite
    const rc=document.getElementById('real-sprite-'+p.id);
    if(rc&&SPRITES[p.id]){
      const rctx=rc.getContext('2d');
      rctx.clearRect(0,0,48,48);
      SPRITES[p.id](rctx);
    }
    if(p.evo){
      p.evo.chain.forEach((name,i)=>{
        const ec=document.getElementById('evo-'+p.id+'-'+i);
        if(ec&&EVO_SPRITES[name]){
          const ectx=ec.getContext('2d');
          ectx.clearRect(0,0,24,24);
          EVO_SPRITES[name](ectx);
        }
      });
    }
  });
}

/* ===== Filtering & Search ===== */
function filterCards(){
  const search=document.getElementById('search').value.toLowerCase();
  const activeCat=document.querySelector('.filter-btn.active').dataset.cat;
  const typeVal=document.getElementById('typeFilter').value;
  const isRealView=document.body.classList.contains('real-view');
  document.querySelectorAll('.card').forEach(card=>{
    let show=true;
    if(activeCat!=='All'&&card.dataset.cat!==activeCat) show=false;
    if(typeVal!=='All'&&!card.dataset.types.includes(typeVal)) show=false;
    if(search){
      const matchPoke=card.dataset.name.includes(search);
      const matchReal=card.dataset.realname&&card.dataset.realname.includes(search);
      if(!matchPoke&&!matchReal) show=false;
    }
    card.classList.toggle('hidden',!show);
  });
}

/* ===== View Toggle ===== */
function setViewMode(mode){
  if(mode==='real'){
    document.body.classList.add('real-view');
  }else{
    document.body.classList.remove('real-view');
  }
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('flipped'));
  document.querySelectorAll('#viewToggle button').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.view===mode);
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  buildCards();
  drawSprites();
  loadAllWikiImages();

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    });
  });

  document.getElementById('typeFilter').addEventListener('change',filterCards);
  document.getElementById('search').addEventListener('input',filterCards);

  document.querySelectorAll('#viewToggle button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      setViewMode(btn.dataset.view);
    });
  });
});

</script>

<!-- Scanner Modal -->
<div id="scanModal">
<div class="scan-box">
  <button class="scan-close" id="scanClose">&times;</button>
  <h2>&#128270; SPECIES SCANNER</h2>
  <div class="scan-api-setup" id="apiSetup">
    <label>Anthropic API Key</label>
    <input type="password" id="claudeKey" placeholder="Paste your API key...">
    <div class="api-hint">Get one at <span style="color:#00b894">console.anthropic.com</span></div>
  </div>
  <div class="scan-drop" id="scanDrop">
    <div class="scan-drop-text">&#128444;&#65039; Drop a photo here or <span>browse</span></div>
    <input type="file" id="scanFile" accept="image/*" style="display:none">
  </div>
  <div class="scan-or">— or —</div>
  <button class="scan-cam-btn" id="scanCamBtn">&#128247; Use Camera</button>
  <div class="scan-preview" id="scanPreview">
    <img id="scanImg">
    <video id="scanVideo" autoplay playsinline></video>
    <canvas id="scanCanvas"></canvas>
    <button class="scan-cam-btn" id="scanCapture" style="display:none;margin-top:10px;">&#128248; Capture</button>
  </div>
  <button class="scan-go" id="scanGo">IDENTIFY</button>
  <div class="scan-result" id="scanResult"></div>
</div>
</div>

<script>
(function(){
  const CLAUDE_MODEL='claude-sonnet-4-20250514';
  const KEY_STORAGE='denver_pokedex_claude_key';

  const speciesList=POKEMON.map(p=>({
    id:p.id,name:p.name,realName:p.real.name,sci:p.real.sci,
    cat:p.cat,types:p.types
  }));

  const modal=document.getElementById('scanModal');
  const scanBtn=document.getElementById('scanBtn');
  const scanClose=document.getElementById('scanClose');
  const scanDrop=document.getElementById('scanDrop');
  const scanFile=document.getElementById('scanFile');
  const scanCamBtn=document.getElementById('scanCamBtn');
  const scanPreview=document.getElementById('scanPreview');
  const scanImg=document.getElementById('scanImg');
  const scanVideo=document.getElementById('scanVideo');
  const scanCanvas=document.getElementById('scanCanvas');
  const scanCapture=document.getElementById('scanCapture');
  const scanGo=document.getElementById('scanGo');
  const scanResult=document.getElementById('scanResult');
  const claudeKeyInput=document.getElementById('claudeKey');

  let currentImageBase64=null;
  let currentMediaType=null;
  let cameraStream=null;

  // Restore saved key
  const savedKey=localStorage.getItem(KEY_STORAGE);
  if(savedKey)claudeKeyInput.value=savedKey;

  claudeKeyInput.addEventListener('change',()=>{
    localStorage.setItem(KEY_STORAGE,claudeKeyInput.value.trim());
  });

  scanBtn.addEventListener('click',()=>{
    modal.classList.add('open');
    resetScanner();
  });
  scanClose.addEventListener('click',closeModal);
  modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});

  function closeModal(){
    modal.classList.remove('open');
    stopCamera();
    resetScanner();
  }
  function resetScanner(){
    currentImageBase64=null;
    currentMediaType=null;
    scanPreview.style.display='none';
    scanImg.style.display='none';
    scanVideo.style.display='none';
    scanCapture.style.display='none';
    scanGo.style.display='none';
    scanResult.classList.remove('show');
    scanResult.innerHTML='';
  }

  // Drag & drop
  scanDrop.addEventListener('click',()=>scanFile.click());
  scanDrop.addEventListener('dragover',e=>{e.preventDefault();scanDrop.classList.add('dragover');});
  scanDrop.addEventListener('dragleave',()=>scanDrop.classList.remove('dragover'));
  scanDrop.addEventListener('drop',e=>{
    e.preventDefault();scanDrop.classList.remove('dragover');
    if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0]);
  });
  scanFile.addEventListener('change',e=>{
    if(e.target.files.length)handleFile(e.target.files[0]);
  });

  function handleFile(file){
    if(!file.type.startsWith('image/'))return;
    stopCamera();
    const reader=new FileReader();
    reader.onload=e=>{
      scanImg.src=e.target.result;
      scanImg.style.display='block';
      scanVideo.style.display='none';
      scanCapture.style.display='none';
      scanPreview.style.display='block';
      scanGo.style.display='inline-block';
      const parts=e.target.result.split(',');
      const mimeMatch=parts[0].match(/data:(image\/[^;]+)/);
      currentMediaType=mimeMatch?mimeMatch[1]:'image/jpeg';
      currentImageBase64=parts[1];
    };
    reader.readAsDataURL(file);
  }

  // Camera
  scanCamBtn.addEventListener('click',async()=>{
    try{
      cameraStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'environment',width:{ideal:1280},height:{ideal:960}}
      });
      scanVideo.srcObject=cameraStream;
      scanVideo.style.display='block';
      scanImg.style.display='none';
      scanCapture.style.display='inline-block';
      scanPreview.style.display='block';
      scanGo.style.display='none';
    }catch(err){
      alert('Camera access denied. Try uploading a photo instead.');
    }
  });

  scanCapture.addEventListener('click',()=>{
    const canvas=scanCanvas;
    canvas.width=scanVideo.videoWidth;
    canvas.height=scanVideo.videoHeight;
    canvas.getContext('2d').drawImage(scanVideo,0,0);
    const dataUrl=canvas.toDataURL('image/jpeg',0.85);
    scanImg.src=dataUrl;
    scanImg.style.display='block';
    scanVideo.style.display='none';
    scanCapture.style.display='none';
    scanGo.style.display='inline-block';
    currentMediaType='image/jpeg';
    currentImageBase64=dataUrl.split(',')[1];
    stopCamera();
  });

  function stopCamera(){
    if(cameraStream){
      cameraStream.getTracks().forEach(t=>t.stop());
      cameraStream=null;
    }
  }

  // Identify
  scanGo.addEventListener('click',async()=>{
    const apiKey=claudeKeyInput.value.trim();
    if(!apiKey){
      claudeKeyInput.style.borderColor='#e17055';
      claudeKeyInput.focus();
      return;
    }
    if(!currentImageBase64)return;

    scanGo.disabled=true;
    scanGo.innerHTML='<span class="scan-spinner"></span>Scanning...';
    scanResult.classList.remove('show');

    const prompt=`You are a species identification expert for Denver/Front Range Colorado wildlife.

Look at this photo and determine if it matches ANY of these 35 local species:

${speciesList.map(s=>`ID:${s.id} — ${s.realName} (${s.sci}) [${s.cat}]`).join('\n')}

IMPORTANT — Watch for commonly confused species. Use these distinguishing features:

BEARS: Black Bear (ID:12) has a FLAT facial profile, NO shoulder hump, tall pointed ears, shorter curved claws. REJECT Grizzly Bears which have a concave dish-shaped face, prominent shoulder hump, small rounded ears, and long straight claws.

DEER: Mule Deer (ID:11) has very large mule-like ears (3/4 head length), forking/bifurcating antlers, rope-like tail with black tip, and white rump patch. REJECT White-tailed Deer which have smaller ears, single-beam antlers with tines off one main beam, and a broad brown tail with white underside they "flag" when alarmed.

BUTTERFLIES: Monarch (ID:33) has NO black line across the hindwing, wingspan 3.5-5 inches, three orange patches at forewing top edge. REJECT Viceroy Butterflies which have a distinctive extra BLACK LINE running across the hindwing, are smaller (2.5-3.5 inch wingspan), and have four orange patches at the forewing edge.

SNAKES: Bull Snake (ID:28) has a NARROW head streamlined with body, ROUND pupils, no facial pits, pale yellow/cream base color. Prairie Rattlesnake (ID:29) has a TRIANGULAR head wider than body, VERTICAL slit pupils, heat-sensing pits above nostrils, darker coloring, and a RATTLE on the tail tip.

PLANTS: Prickly Pear Cactus (ID:3) has flat oval paddle-shaped pads with spines. Yucca (ID:4) has long narrow sword-like leaves in a rosette. Blanket Flower (ID:5) has daisy-like flowers with red/orange petals and yellow tips. These look nothing alike — check carefully.

Respond in EXACTLY this JSON format, nothing else:
{"matched":true,"id":NUMBER,"confidence":"high|medium|low","reason":"Brief explanation of why this matches, citing the distinguishing features you used"}

Or if it does NOT match any of the 35 species:
{"matched":false,"id":null,"confidence":null,"reason":"Brief explanation of what the photo shows and why it doesn't match any species"}

CRITICAL: Most photos will NOT match any of these 35 species. Default to "no match" unless you can positively identify the EXACT species. Do NOT match based on broad category alone:
- A snake photo is NOT automatically a Bull Snake or Rattlesnake — there are thousands of snake species. Only match if you see specific identifying features.
- A frog photo is NOT automatically a Boreal Chorus Frog — only match if it's clearly a tiny (~1 inch) brown/gray frog with dorsal stripes.
- A tree photo is NOT automatically a Quaking Aspen — only match if you see the distinctive white bark with black knots and round trembling leaves.
- A canid photo is NOT automatically a Coyote — dogs, wolves, and foxes should not match.
- Any bird, insect, plant, or mammal must match the SPECIFIC species listed, not just the general type.

If unsure, return matched:false. A false negative (missing a real match) is much better than a false positive (matching the wrong species).`;

    try{
      const resp=await fetch('/api/identify',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          api_key:apiKey,
          model:CLAUDE_MODEL,
          image:currentImageBase64,
          media_type:currentMediaType||'image/jpeg',
          prompt:prompt
        })
      });
      const data=await resp.json();

      if(data.error){
        throw new Error(data.error.message||'API error');
      }

      const text=data.content[0].text;
      const jsonMatch=text.match(/\{[\s\S]*\}/);
      if(!jsonMatch)throw new Error('Could not parse response');

      const result=JSON.parse(jsonMatch[0]);
      showResult(result);
    }catch(err){
      scanResult.innerHTML=`<div class="match-none">Error: ${err.message}</div>`;
      scanResult.classList.add('show');
    }

    scanGo.disabled=false;
    scanGo.innerHTML='IDENTIFY';
  });

  function showResult(result){
    if(result.matched&&result.id){
      const p=POKEMON.find(x=>x.id===result.id);
      if(p){
        const confColor=result.confidence==='high'?'#00b894':result.confidence==='medium'?'#fdcb6e':'#e17055';
        scanResult.innerHTML=`
          <div class="match-name">#${String(p.id).padStart(3,'0')} ${p.name}</div>
          <div class="match-real">${p.real.name} <span style="color:#a29bfe;font-style:italic">(${p.real.sci})</span></div>
          <div class="match-conf" style="color:${confColor}">Confidence: ${result.confidence.toUpperCase()}</div>
          <div class="match-reason">${result.reason}</div>
          <button class="match-go-btn" onclick="document.getElementById('scanModal').classList.remove('open');
            document.querySelector('[data-id=\\'${p.id}\\']').scrollIntoView({behavior:'smooth',block:'center'});
            document.querySelector('[data-id=\\'${p.id}\\']').style.boxShadow='0 0 30px rgba(0,184,148,.6)';
            setTimeout(()=>document.querySelector('[data-id=\\'${p.id}\\']').style.boxShadow='',3000);">
            &#8594; View in Pokedex
          </button>`;
      }else{
        scanResult.innerHTML=`<div class="match-none">Matched ID ${result.id} but couldn't find entry.</div>`;
      }
    }else{
      scanResult.innerHTML=`
        <div class="match-none">No match found in Denver Pokedex</div>
        <div class="match-reason">${result.reason||'This species is not in the Denver Pokedex.'}</div>`;
    }
    scanResult.classList.add('show');
  }
})();
</script>
</body>
